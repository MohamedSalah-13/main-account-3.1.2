dbsetup.provision.stored.programs.declined=تنبيه: اخترت ألا تسمح بتغيير الإعداد log_bin_trust_function_creators، وMySQL سيرفض إنشاء الـ Triggers، فسيفشل البرنامج في إنشاء جداوله عند أول تشغيل. عندما تقرر ذلك نفّذ بحساب root: SET PERSIST log_bin_trust_function_creators = 1;
