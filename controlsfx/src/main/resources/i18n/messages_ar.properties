dbsetup.provision.allow.stored.programs.help=يفعّل log_bin_trust_function_creators على خادم MySQL كله وبشكل دائم، ولا يُنفَّذ إلا إذا كان الخادم سيرفض. بدونه يتوقف البرنامج في أول تشغيل. ألغِ التحديد فقط إذا كان الخادم مشتركًا مع برامج أخرى وستضبطه بنفسك.
