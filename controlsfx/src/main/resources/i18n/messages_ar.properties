# أسماء الصلاحيات - permission.<key>
#
# اسم كل صلاحية كما يقرؤه صاحب المحل في شاشة الأدوار. تُقرأ من PermissionLabels
# ولا تُقرأ من auth_permission.description: ذلك العمود يحمل المفتاح نفسه في 108
# صفوف من 162، لأن V1 يزرع صفوف الصلاحيات بأسماء بلا أوصاف، وsynchronizeCatalog
