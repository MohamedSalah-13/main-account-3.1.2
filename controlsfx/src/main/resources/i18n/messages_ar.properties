#
# إضافة صلاحية = ثابت واحد في AppPermissions + ثلاثة أسطر هنا. لا migration.
# PermissionCatalogArchitectureTest يفشل إن غاب مفتاح عن أي من الملفات الثلاثة.
# ============================================================================

