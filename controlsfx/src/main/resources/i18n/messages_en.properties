# Permission names - permission.<key>
#
# What a permission is called in the roles screen. Read through PermissionLabels
# and no longer from auth_permission.description: that column holds the key
# itself for 108 of the 162 keys, because V1 seeds the permission rows with
# names and no descriptions and synchronizeCatalog writes
# description = permission_key for a row it inserts and never returns to it.
# English used to derive the words from the key, which read "Total Sales Re
# Show", and Arabic read "treasury.capital".
#
# Adding a permission is one constant in AppPermissions plus three lines of
# translation. No migration. PermissionCatalogArchitectureTest fails when a key
# is missing from any of the three bundles.
# ============================================================================

