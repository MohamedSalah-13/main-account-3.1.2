name: Auto Release JAR

# 1. متى يتم تشغيل هذا البناء؟ (عند رفع Tag يبدأ بحرف v)
on:
  push:
    tags:
      - 'v*' # سيتم التشغيل عند رفع tag مثل: v1.0.0 أو v2.3

# 2. إعطاء الصلاحيات للبوت لإنشاء Release ورفع الملفات
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21' # تأكد من مطابقة إصدار الجافا لمشروعك
          distribution: 'temurin'
          cache: maven

      # 3. بناء المشروع وتوليد الـ JAR
      - name: Build with Maven
        run: mvn clean package

      # 4. إنشاء الإصدار (Release) ورفع ملفات الـ JAR إليه
      - name: Create GitHub Release and Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          # رفع كل ملفات الـ JAR الموجودة في مجلد target
          files: target/*.jar
          # توليد ملاحظات الإصدار (Release Notes) تلقائياً بناءً على الـ Commits
          generate_release_notes: true