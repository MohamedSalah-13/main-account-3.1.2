name: Auto Release JAR

# 1. يعمل فقط عند رفع Tag يبدأ بحرف v
on:
  push:
    tags:
      - 'v*'

# 2. إعطاء الصلاحيات لإنشاء صفحة الإصدار ورفع الملفات
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 3. جلب كود مشروعك الأساسي (في المسار الرئيسي)
      - name: Checkout main repository
        uses: actions/checkout@v4

      # 4. جلب كود مكتبة fx-commons
      - name: Checkout fx-commons library
        uses: actions/checkout@v4
        with:
          # ⚠️ هام: استبدل السطر التالي باسم الحساب/المستودع الصحيح
          repository: MohamedSalah-13/fx-commons
          path: fx-commons-lib

      # 5. إعداد الجافا
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 6. تثبيت مكتبة fx-commons أولاً
      - name: Install fx-commons locally
        run: mvn clean install -DskipTests
        working-directory: ./fx-commons-lib

      # 7. بناء مشروعك الأساسي
      - name: Build main project
        run: mvn clean package

      # 8. إنشاء الإصدار التلقائي ورفع الـ JAR
      - name: Create GitHub Release and Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          # البحث عن ملف الـ JAR في أي مجلد target ورفعه
          files: '**/target/*.jar'
          generate_release_notes: true