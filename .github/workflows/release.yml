name: Auto Release JAR

# 1. يعمل فقط عند رفع Tag يبدأ بحرف v
on:
  push:
    tags:
      - 'v*'

# 2. إعطاء الصلاحيات لإنشاء صفحة الإصدار ورفع الملفات
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 3. جلب كود مشروعك الأساسي (في المسار الرئيسي)
      - name: Checkout main repository
        uses: actions/checkout@v4

      # 4. جلب كود مكتبة fx-commons
      - name: Checkout fx-commons library
        uses: actions/checkout@v4
        with:
          # ⚠️ هام: استبدل السطر التالي باسم الحساب/المستودع الصحيح
          repository: MohamedSalah-13/fx-commons
          path: fx-commons-lib

      # 5. إعداد الجافا
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 6. تثبيت مكتبة fx-commons أولاً
      - name: Install fx-commons locally
        run: mvn clean install -DskipTests
        working-directory: ./fx-commons-lib

      # 7. بناء مشروعك الأساسي
      - name: Build main project
        run: mvn clean package

      # 8. ملاحظة الإصدار المكتوبة: docs/release-notes/<الوسم>.md، وعنوانها أول سطر فيها.
      #    وسم بلا ملف (إصدار عاجل مثلًا) يرجع إلى الملاحظات المولَّدة آليًا بدل أن يفشل الإصدار.
      - name: Find the written release notes
        id: notes
        run: |
          file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
            echo "title=$(head -n 1 "$file" | tr -d '\r' | sed 's/^#\+ *//')" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no $file - falling back to generated release notes"
          fi

      # 9. إنشاء الإصدار ورفع الـ JAR
      - name: Create GitHub Release and Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          # البحث عن ملف الـ JAR في أي مجلد target ورفعه
          files: '**/target/*.jar'
          name: ${{ steps.notes.outputs.title || github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}