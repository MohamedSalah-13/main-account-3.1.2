name: Java CI with Maven

# 1. متى يتم تشغيل هذا البناء؟
on:
  push:
    branches: [ "main", "master" ] # عند الرفع على هذه الفروع
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # الخادم الذي سيعمل عليه الكود

    steps:
      # 2. جلب الكود الخاص بك من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. إعداد بيئة الجافا
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21' # ⚠️ قم بتغيير هذا الرقم لإصدار الجافا الذي تستخدمه (مثلاً 8, 11, 17, 21)
          distribution: 'temurin'
          cache: maven # هذه الميزة تسرع البناء مستقبلاً بتخزين المكتبات

      # 4. تشغيل أمر البناء
      - name: Build with Maven
        run: mvn clean package

      # 5. حفظ ملف الـ JAR الناتج لتتمكن من تحميله
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-application-jar # الاسم الذي سيظهر لك للتحميل
          path: target/*.jar # مسار الملفات التي سيتم حفظها